[theme]
primaryColor = "#4F8EF7"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2E"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = true
enableCORS = false
# Note: enableXsrfProtection is set to false via CLI flag on Render (required for reverse proxy)
# For local development it remains true (safe default)
enableXsrfProtection = false

[browser]
gatherUsageStats = false
